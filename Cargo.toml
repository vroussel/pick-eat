[package]
name = "pickeat-server"
version = "0.2.0"
authors = ["Valentin.Roussel <valentin.rssl@gmail.com>"]
edition = "2024"

[profile.release]
lto = "thin"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", features = ["http2"] }
clap = { version = "4.5.41", features = ["derive"] }
reqwest = "0.12.22"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = ["rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
tempfile = "3.20.0"
