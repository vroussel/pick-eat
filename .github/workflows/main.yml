---
name: Rust CI
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  DB_SUPERUSER_PASSWORD: postgres
  DB_PICKEAT_PASSWORD: pickeat
  DB_PICKEAT_APP_PASSWORD: app
jobs:
  check-sqlx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Set DATABASE_URL
        run: |
          echo "DATABASE_URL=postgres://pickeat:${DB_PICKEAT_PASSWORD}@localhost:5432/pickeat" >> $GITHUB_ENV
      - name: Launch db container
        run: docker compose --file infra/compose-ci.yml --project-directory . up --detach
          --wait
      - name: Show postgres logs
        if: failure()
        run: docker compose --file infra/compose-ci.yml --project-directory . logs
          postgres
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run SQL migrations
        run: sqlx migrate run --source db/migrations/
      - name: Check sqlx prepare
        run: cargo sqlx prepare --check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

    # Lint and check formatting
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run rustfmt
        run: cargo fmt -- --check

    # Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    # Partially build and run tests
      - name: Build docker image (builder stage, for testing purpose)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: builder
          load: true
          tags: builder
          cache-from: |
            type=registry,ref=ghcr.io/vroussel/pick-eat-cache:${{ github.ref_name }}
            type=registry,ref=ghcr.io/vroussel/pick-eat-cache:v2
      - name: Launch db container
        run: docker compose --file infra/compose-ci.yml --project-directory . up --detach
          --wait
      - name: Show postgres logs
        if: failure()
        run: docker compose --file infra/compose-ci.yml --project-directory . logs
          postgres
      - name: Run tests
        run: docker run --rm -e DB_PICKEAT_APP_PASSWORD -e DB_PICKEAT_PASSWORD --network=host
          builder cargo test

    # Build and push docker images, with staging tag
      - name: Fetch short commit sha
        run: echo "SHA_SHORT=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build docker image (runtime stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vroussel/pick-eat:staging
            ghcr.io/vroussel/pick-eat:${{ env.SHA_SHORT }}
          cache-from: |
            type=registry,ref=ghcr.io/vroussel/pick-eat-cache:${{ github.ref_name }}
            type=registry,ref=ghcr.io/vroussel/pick-eat-cache:v2
          cache-to: |
            type=registry,ref=ghcr.io/vroussel/pick-eat-cache:${{ github.ref_name }},mode=max
      - name: Build DB docker image (builder stage, for testing purpose)
        uses: docker/build-push-action@v6
        with:
          context: ./infra/postgres
          platforms: linux/amd64,linux/arm64
          file: infra/postgres/Dockerfile
          push: true
          tags: |
            ghcr.io/vroussel/pick-eat-postgres:staging
            ghcr.io/vroussel/pick-eat-postgres:${{ env.SHA_SHORT }}
          cache-from: |
            type=registry,ref=ghcr.io/vroussel/pick-eat-postgres-cache:${{ github.ref_name }}
            type=registry,ref=ghcr.io/vroussel/pick-eat-postgres-cache:v2
          cache-to: |-
            type=registry,ref=ghcr.io/vroussel/pick-eat-postgres-cache:${{ github.ref_name }},mode=max
