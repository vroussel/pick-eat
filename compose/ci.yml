services:
  postgres:
    build: ./db
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      DB_PICKEAT_PASSWORD_FILE: /run/secrets/db_pickeat_password
      DB_PICKEAT_APP_PASSWORD_FILE: /run/secrets/db_pickeat_app_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickeat -d pickeat"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
    secrets:
      - db_superuser_password
      - db_pickeat_password
      - db_pickeat_app_password
secrets:
  db_superuser_password:
    environment: DB_SUPERUSER_PASSWORD
  db_pickeat_password:
    environment: DB_PICKEAT_PASSWORD
  db_pickeat_app_password:
    environment: DB_PICKEAT_APP_PASSWORD
