---
services:
  nginx:
    build:
      dockerfile: ./infra/nginx/Dockerfile
    network_mode: host
    volumes: [./infra/nginx/dev/conf.d/:/etc/nginx/conf.d]
    develop:
      watch:
        - action: rebuild
          path: ./infra/nginx/
        - action: rebuild
          path: ./web/assets/
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      DB_PICKEAT_PASSWORD: ${DB_PICKEAT_PASSWORD}
      DB_PICKEAT_APP_PASSWORD: ${DB_PICKEAT_APP_PASSWORD}
    ports: [5432:5432]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pickeat -d pickeat]
      interval: 2s
      timeout: 5s
      retries: 10
    # Uncomment this to tests migrations easily
    tmpfs: [/var/lib/postgresql]
    develop:
      watch:
        - action: rebuild
          path: ./infra/postgres/
        - action: rebuild
          path: ./db/migrations/
  migrate:
    build:
      context: .
      dockerfile_inline: |
        FROM rust:slim
        RUN cargo install sqlx-cli --no-default-features --features postgres
        ENTRYPOINT ["sqlx", "migrate", "run"]
    volumes: [./db/migrations:/migrations]
    environment:
      DATABASE_URL: postgres://pickeat:${DB_PICKEAT_PASSWORD}@postgres:5432/pickeat
    depends_on:
      postgres:
        condition: service_healthy
