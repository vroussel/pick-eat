---
services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      DB_PICKEAT_PASSWORD: ${DB_PICKEAT_PASSWORD}
      DB_PICKEAT_APP_PASSWORD: ${DB_PICKEAT_APP_PASSWORD}
    ports: [5432:5432]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pickeat -d pickeat]
      interval: 2s
      timeout: 5s
      retries: 10
